<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
           width: 320px; margin: 0; padding: 16px; color: #222; }
    .doc { margin-bottom: 12px; }
    .doc .label { color: #888; font-size: 11px; }
    .doc .url { word-break: break-all; font: 12px monospace; color: #333;
                background: #f5f5f5; padding: 6px 8px; border-radius: 4px; margin-top: 4px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 4px;
             background: #0077ff; color: white; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 12px; padding: 8px 10px; border-radius: 4px; font-size: 12px; }
    .status.ok  { background: #e6f7e6; color: #1a6b1a; }
    .status.err { background: #fce8e8; color: #a33; }
    .status.run { background: #eef4ff; color: #225; }
    .opt { display: block; text-align: center; margin-top: 12px;
           color: #888; font-size: 11px; text-decoration: none; }
    .opt:hover { color: #333; }
  </style>
</head>
<body>
  <div class="doc">
    <div class="label">当前页面</div>
    <div class="url" id="url">--</div>
  </div>
  <div id="localBox" style="display:none; margin-bottom: 8px;">
    <label style="font-size: 12px; color: #555; cursor: pointer;">
      <input type="checkbox" id="writeLocal"> 同时写入本地文件夹
    </label>
  </div>
  <button id="go">导入</button>
  <div id="status" class="status" style="display:none"></div>
  <a class="opt" href="#" id="openOpts">设置</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
